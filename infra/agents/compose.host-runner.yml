services:
  server:
    volumes:
      - ${JARVIS_WORK_HOST_DIR:-/srv/jarvis/work}:/work
      - ${JARVIS_PUBLISH_HOST_DIR:-/srv/jarvis-publish}:/publish
    environment:
      PUBLISH_DIR: /publish
  worker:
    volumes:
      - ${JARVIS_WORK_HOST_DIR:-/srv/jarvis/work}:/work
  whatsapp-bridge:
    volumes:
      - ${JARVIS_WORK_HOST_DIR:-/srv/jarvis/work}:/work
  backup:
    volumes:
      - ${JARVIS_WORK_HOST_DIR:-/srv/jarvis/work}:/work
