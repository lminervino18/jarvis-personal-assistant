[env:atom-echo]
platform = espressif32@7.1.3
board = m5stack-atom
framework = arduino
monitor_speed = 115200
board_build.embed_txtfiles = certs/root_ca.pem
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    bblanchon/ArduinoJson@7.4.3
