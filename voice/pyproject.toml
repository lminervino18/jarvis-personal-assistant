[project]
name = "jarvis-voice"
version = "0.1.0"
description = "Private voice dataset tooling for J.A.R.V.I.S. (no audio or datasets are ever committed)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "soundfile",
    "torch",
    "torchaudio",
    "silero-vad",
    "speechbrain",
    "faster-whisper==1.2.1",
    "av==16.0.1",
]

[project.optional-dependencies]
separate = ["demucs"]

[project.scripts]
jarvis-voice = "jarvis_voice.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis_voice"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
